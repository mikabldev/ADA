services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      ADA_DATA_DIR: /data
      ADA_DATABASE_PATH: /data/jobs.sqlite3
      ADA_MAX_TRACKS: ${ADA_MAX_TRACKS:-100}
      ADA_MAX_WORKERS: ${ADA_MAX_WORKERS:-2}
      ADA_MAX_JOB_BYTES: ${ADA_MAX_JOB_BYTES:-5368709120}
      ADA_JOB_TTL_SECONDS: ${ADA_JOB_TTL_SECONDS:-3600}
      ADA_DOWNLOAD_TIMEOUT_SECONDS: ${ADA_DOWNLOAD_TIMEOUT_SECONDS:-1800}
    volumes: ["ada-data:/data"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    pids_limit: 256
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:8080"]
volumes:
  ada-data:
